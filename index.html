<!DOCTYPE html>
<html>

<head>
    <title>AI Workout & Diet Planner</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            max-width: 1200px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 25px;
            display: none;
        }

        .plans-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .plans-container {
                grid-template-columns: 1fr;
            }
        }

        .plan-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            height: fit-content;
        }

        .plan-section h3 {
            color: #667eea;
            margin-top: 0;
            font-size: 22px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .plan-content {
            max-height: 600px;
            overflow-y: auto;
            padding: 10px 0;
            line-height: 1.8;
            color: #333;
        }

        .plan-content ul {
            margin: 0;
            padding-left: 20px;
            list-style: none;
        }

        .plan-content li {
            margin: 10px 0;
            padding-left: 20px;
            position: relative;
        }

        .plan-content li:before {
            content: "•";
            color: #667eea;
            font-weight: bold;
            position: absolute;
            left: 0;
            font-size: 20px;
        }

        .plan-content p {
            margin: 8px 0;
        }

        /* Scrollbar styling */
        .plan-content::-webkit-scrollbar {
            width: 6px;
        }

        .plan-content::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .plan-content::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .plan-content::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-weight: bold;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>AI Workout & Diet Planner</h2>

        <input id="age" type="number" placeholder="Age">
        <input id="height" type="number" placeholder="Height (cm)">
        <input id="weight" type="number" placeholder="Weight (kg)">

        <select id="goal">
            <option value="weight_loss">Weight Loss</option>
            <option value="muscle_gain">Muscle Gain</option>
            <option value="fitness">General Fitness</option>
        </select>

        <select id="diet">
            <option value="veg">Vegetarian</option>
            <option value="nonveg">Non-Vegetarian</option>
        </select>

        <button onclick="getPlan()">Generate Plan</button>

        <div class="result" id="output"></div>
    </div>

    <script>
        function formatBulletPoints(text) {
            if (!text) return '';

            // Escape HTML to prevent XSS
            let html = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            // Convert lines starting with - or * to list items
            html = html.replace(/^[\-\*]\s+(.+)$/gim, '<li>$1</li>');

            // Convert numbered lists (1., 2., etc.) to bullet points
            html = html.replace(/^\d+\.\s+(.+)$/gim, '<li>$1</li>');

            // Wrap consecutive list items in <ul>
            html = html.replace(/(<li>.*<\/li>\n?)+/g, function (match) {
                // Remove any existing <ul> tags
                match = match.replace(/<\/?ul>/g, '');
                return '<ul>' + match + '</ul>';
            });

            // Convert line breaks to <br> for non-list content
            html = html.replace(/\n/g, '<br>');

            // Remove <br> tags inside <ul> tags
            html = html.replace(/(<ul>)(.*?)(<\/ul>)/gs, function (match, open, content, close) {
                content = content.replace(/<br>/g, '');
                return open + content + close;
            });

            // Wrap in paragraph if needed
            if (!html.trim().startsWith('<')) {
                html = '<p>' + html + '</p>';
            }

            return html;
        }

        function getPlan() {
            const output = document.getElementById('output');
            output.style.display = 'block';
            output.innerHTML = '<div class="loading">Generating your personalized plan... Please wait!</div>';

            fetch("http://127.0.0.1:5000/generate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    age: document.getElementById('age').value,
                    height: document.getElementById('height').value,
                    weight: document.getElementById('weight').value,
                    goal: document.getElementById('goal').value,
                    diet: document.getElementById('diet').value
                })
            })
                .then(res => res.json())
                .then(data => {
                    const workoutHtml = formatBulletPoints(data.workout);
                    const dietHtml = formatBulletPoints(data.diet);

                    output.innerHTML = `
            <div class="plans-container">
                <div class="plan-section">
                    <h3>💪 Workout Plan</h3>
                    <div class="plan-content">${workoutHtml}</div>
                </div>
                <div class="plan-section">
                    <h3>🍎 Diet Plan</h3>
                    <div class="plan-content">${dietHtml}</div>
                </div>
            </div>
        `;
                })
                .catch(error => {
                    output.innerHTML = `<div style="color: red; padding: 20px;">Error: ${error.message}. Please make sure the Flask server is running.</div>`;
                });
        }
    </script>

</body>

</html>
